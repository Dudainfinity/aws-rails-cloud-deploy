name: Deploy Rails App

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: RuboCop
        run: bin/rubocop -f github

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Brakeman
        run: bin/brakeman --no-pager
      - name: Bundler Audit
        run: bin/bundler-audit

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: [lint, security]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v3
      - name: Instalar dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y libpq-dev libvips
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Rodar testes
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
        run: bin/rails db:test:prepare test

  deploy:
    name: Deploy EC2
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Deploy na EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/aws-rails-cloud-deploy
            git pull origin main
            docker compose --env-file .env.production down
            docker compose --env-file .env.production up -d --build

      - name: Health check
        run: |
          echo "Aguardando aplicação subir..."
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }})
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check falhou! Status: $STATUS"
            exit 1
          fi
          echo "Deploy concluído com sucesso!"
